name: Lint & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: "py${{ matrix.python-version }} — lint + unit tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('setup.py', 'dev-requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r dev-requirements.txt

      - name: flake8
        run: python -m flake8 dbt tests

      - name: mypy
        run: python -m mypy dbt
        continue-on-error: true  # soften while types stabilise

      - name: Unit tests
        run: python -m pytest tests/unit -v
