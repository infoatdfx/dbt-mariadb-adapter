default:
  target: dev
  outputs:
    dev:
      type: mariadb
      server: [server/host]
      port: [port]  # optional
      database: [schema]  # optional, must equal schema if set
      schema: [schema]
      username: [username]
      password: [password]
      charset: utf8mb4
      collation: utf8mb4_uca1400_ai_ci  # MariaDB-native collation
    prod:
      type: mariadb
      server: [server/host]
      port: [port]
      database: [schema]
      schema: [schema]
      username: [username]
      password: [password]
      charset: utf8mb4
      collation: utf8mb4_uca1400_ai_ci
